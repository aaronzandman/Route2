name: Update store list

on:
  schedule:
    - cron: "17 10 * * *"   # every day, about 6:17 AM Eastern
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - source/update_stores.py
      - .github/workflows/update-stores.yml

permissions:
  contents: write

concurrency:
  group: update-stores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Add any new stores and rebuild
        run: python source/update_stores.py
      - name: Commit and push if anything changed
        run: |
          if [ -f .store-update-msg ]; then
            git config user.name "route2-store-bot"
            git config user.email "route2-store-bot@users.noreply.github.com"
            msg="$(cat .store-update-msg)"; rm .store-update-msg
            git add -A
            git commit -m "$msg"
            git push
          else
            echo "No new stores."
          fi
