name: vendor-leaflet (one-time)
on:
  push:
    paths: [".github/workflows/vendor-leaflet.yml"]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy Leaflet 1.9.4 from npm (integrity-checked by npm)
        run: |
          mkdir -p /tmp/lf && cd /tmp/lf && npm pack leaflet@1.9.4 && tar xzf leaflet-1.9.4.tgz
          mkdir -p "$GITHUB_WORKSPACE/vendor/leaflet"
          cp package/dist/leaflet.js package/dist/leaflet.css package/LICENSE "$GITHUB_WORKSPACE/vendor/leaflet/"
      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/vendor-leaflet.yml
          git add vendor/leaflet
          git commit -m "Vendor Leaflet 1.9.4 (BSD-2-Clause) for the desktop route map"
          git push
